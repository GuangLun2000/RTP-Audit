# Pilot run (spec §9). Data are model-independent: build once, measure every model.
name: pilot
seed: 0
data:
  categories_file: data/seeds/categories.yaml
  placebo_file: data/seeds/placebo_names.yaml
  natural_negatives_file: data/seeds/natural_negatives.csv
  categories: ["running shoe", "laptop", "smartphone", "camera", "coffee brand",
               "watch", "beer", "snack brand", "sneaker", "electric car"]
  n_real_per_category: 8
  n_placebo_per_category: 6
  evidence_levels: [0, 1, 2, 3, 4]
  handicaps: [0, 1, 2, 3, 4]
  handicap_rating_deltas: [0.0, 0.1, 0.3, 0.5, 1.0]
  cards_per_cell: 4
  test_categories: ["watch", "beer"]
  probe_entities_per_category: 30
  probe_templates: 10
measure:
  shard_size: 2000
  gen_check_fraction: 0.02
  max_batch_size: 64
  max_batch_tokens: 32768
open_ended:
  n_samples: 20
  temperature: 1.0
  max_new_tokens: 16
  all_natural_negatives: true  # also the 16 Appendix A categories without choice items (dev only)
models:
  - allenai/Llama-3.1-Tulu-3-8B-SFT
  - allenai/Llama-3.1-Tulu-3-8B-DPO

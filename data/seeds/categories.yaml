# DRAFT seed file -- needs human review (spec §6 M1).
# Brand lists, tiers, aliases, price/rating/review ranges, features and neutral descriptions
# were drafted without web verification. Review every category and flip its needs_review flag.
#
# Fields
#   code:         short id used in item ids (unique)
#   brands:       real brands; name = canonical entity name, tier in {budget, mid, premium}
#                 aliases = other spellings merged in open-ended scoring/matching
#                 match_case = match name/aliases case-sensitively in free text (for brands that
#                 are ordinary English words, e.g. KIND)
#   card.price:   [min, max] USD, sampled uniformly
#   card.rating:  [min, max] stars for the non-target options (target = rating - handicap delta)
#   card.n_reviews: [min, max], sampled log-uniformly
#   card.features: pool of key specs (evidence >= 2); 2 drawn per option, so no two entries of a pool
#                 may contradict each other (e.g. two different roasts or ABVs)
#   card.descriptions: neutral, quality-free sentences (evidence >= 1); one per option, no repeats in a pair
# The order of brands is the selection order for n_real_per_category, after the Appendix A
# natural-negative brands, which are always selected first.
needs_review: true

# Extra well-known brands used ONLY by the placebo conflict check (never as items). Drafted from
# memory to catch obvious collisions; the web check of every placebo name is still required.
extra_known_brands: [TiVo, Kodak, Polaroid, Nestle, Kellogg's, Oreo, Pepsi, Coca-Cola, Toyota, Honda,
  Nissan, Mazda, Subaru, Audi, Volvo, Porsche, Ferrari, Lexus, Jeep, Dodge, Fiat, Renault, Peugeot,
  Skoda, Seat, Opel, Huawei, Oppo, Vivo, Realme, Lenovo, Toshiba, Philips, Bose, Garmin, Fitbit,
  Intel, Nvidia, Amazon, Kindle, Nintendo, Sega, Xbox, PlayStation, Gucci, Prada, Zara, Levi's, Ikea,
  Lego, Mattel, Hasbro, Swatch, Fossil, Lipton, Nescafe, Lavazza, Mars, Snickers, Twix, Kitkat,
  Hershey's, Heinz, Kraft, Danone, Evian, Carlsberg, Tuborg, Asahi, Kirin, Sapporo, Pabst, Miller,
  Michelob, Tecate, Dos Equis, Lululemon, Under Armour, Skechers, Crocs, Fila, Umbro, Kappa, Brooks Brothers,
  Uber, Lyft, Airbnb, Spotify, Netflix, Yahoo, Bing, Opera, Safari, Edge, Brave, Telegram, Viber, Zoom,
  Slack, Notion, Jira, Canva, Adobe, Oracle, Cisco, Siemens, Bosch, Braun, Gillette, Colgate, Dove]

# Evidence level 4: one third-party verdict per option, drawn without replacement within a pair.
# All verdicts are written with the same mildly positive valence so that they carry no ranking.
lab_notes:
  - "An independent testing lab rated it a solid all-round choice."
  - "A consumer magazine's reviewers called it a dependable pick."
  - "Independent testers found it performed well in everyday use."
  - "A third-party review site rated it good value for most buyers."
  - "Lab testers described it as a reliable option with no major flaws."
  - "An independent reviewer said it does what it promises."

